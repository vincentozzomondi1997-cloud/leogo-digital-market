<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEOGO Seller Dashboard</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--n:#07152f;--o:#ff7a00;--bg:#f5f7fb;--line:#e5e7eb;--muted:#667085;--g:#166534;--r:#991b1b}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:#101828}.wrap{max-width:1100px;margin:auto;padding:18px}.top{background:var(--n);color:#fff}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:24px;font-weight:900}.brand span{color:var(--o)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 10px 35px #07152f14}button{border:0;border-radius:10px;padding:12px 15px;font-weight:900;cursor:pointer}.primary{background:var(--n);color:#fff}.light{background:#eef3fb;color:var(--n)}.error,.success,.notice{padding:12px;border-radius:10px;margin-top:12px}.error{background:#fef2f2;color:var(--r)}.success{background:#ecfdf3;color:var(--g)}.notice{background:#fff7ed;border:1px solid #fed7aa}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center}.login .card{width:min(440px,100%)}input,textarea{width:100%;padding:12px;border:1px solid #d7dce4;border-radius:10px;margin:6px 0 12px;font:inherit}label{font-weight:800;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat b{display:block;font-size:28px;margin-top:5px}.muted{color:var(--muted)}.layout{display:grid;grid-template-columns:210px 1fr;gap:16px}.side button{width:100%;text-align:left;background:transparent;margin:3px 0}.side button.active{background:#eef3fb}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900;background:#ffedd5;color:#9a3412}.green{background:#dcfce7;color:#166534}.red{background:#fee2e2;color:#991b1b}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:600px}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}@media(max-width:750px){.stats{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}</style></head><body><div id="login" class="login"><div class="card"><div class="brand">LEO<span>GO</span> DIGITAL SERVICES</div><h2>Seller Sign In</h2><p class="muted">Sign in using the email and password created during seller registration.</p><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn" class="primary" style="width:100%" onclick="login()">SIGN IN</button><div id="msg"></div></div></div><div id="app" class="hidden"><div class="top"><div class="wrap bar"><div><div class="brand">LEO<span>GO</span> SELLER</div><small>Seller Dashboard</small></div><button class="light" onclick="logout()">SIGN OUT</button></div></div><main class="wrap"><div class="card"><h1 id="businessName">Seller Dashboard</h1><p class="muted" id="ownerLine"></p><div id="statusBox"></div></div><div class="stats"><div class="card stat"><span class="muted">Products</span><b>0</b></div><div class="card stat"><span class="muted">Orders</span><b>0</b></div><div class="card stat"><span class="muted">Pending Orders</span><b>0</b></div><div class="card stat"><span class="muted">Sales</span><b>KSh 0</b></div></div><div class="layout"><aside class="card side"><button class="active" onclick="tab('overview',this)">📊 Overview</button><button onclick="tab('products',this)">🛒 My Products</button><button onclick="tab('orders',this)">📦 My Orders</button><button onclick="tab('profile',this)">🏪 Business Profile</button><button onclick="tab('documents',this)">📄 Documents</button></aside><section id="content"></section></div></main></div><script>const URL='https://twpiloiiigdghwcdjbnj.supabase.co',KEY='sb_publishable_c4iJwLdRuH85e0XuFnkSjg_mdxLN2fX',sb=supabase.createClient(URL,KEY);let seller=null;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const msg=(t,ok=false)=>{let e=document.getElementById('msg');e.className=ok?'success':'error';e.textContent=t};async function load(){let s=await sb.auth.getSession();if(!s.data.session)return;let u=s.data.session.user;if(!u.email_confirmed_at){await sb.auth.signOut();return msg('Please verify your email before signing in.')}let q=await sb.from('sellers').select('*').eq('auth_user_id',u.id).maybeSingle();if(q.error){await sb.auth.signOut();return msg('Seller record could not be loaded: '+q.error.message)}if(!q.data){await sb.auth.signOut();return msg('No LEOGO seller application is linked to this account.')}seller=q.data;if(String(seller.status).toLowerCase()!=='active'){await sb.auth.signOut();return msg('Your seller account is '+seller.status+'. LEOGO approval is required before dashboard access.')}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('businessName').textContent=seller.business_name;document.getElementById('ownerLine').textContent=(seller.owner_name||'')+' · '+(seller.email||u.email);document.getElementById('statusBox').innerHTML='<div class="success"><b>✓ ACTIVE / APPROVED</b> — Your seller account is approved and ready for the product onboarding stage.</div>';overview()}async function login(){let b=document.getElementById('loginBtn');b.disabled=true;b.textContent='SIGNING IN…';let r=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(r.error)msg(r.error.message);else await load();b.disabled=false;b.textContent='SIGN IN'}async function logout(){await sb.auth.signOut();location.reload()}function tab(n,b){document.querySelectorAll('.side button').forEach(x=>x.classList.remove('active'));b.classList.add('active');({overview,products,orders,profile,documents}[n])()}function overview(){document.getElementById('content').innerHTML='<div class="card"><h2>Welcome to your LEOGO Seller Dashboard</h2><p class="muted">This is your private business workspace. From here you will manage products, receive customer orders, monitor sales and maintain your business information.</p><div class="notice"><b>Next production stage:</b> product onboarding. Products created here will receive genuine Supabase UUIDs so customer checkout can process them safely.</div></div>'}function products(){document.getElementById('content').innerHTML='<div class="card"><h2>My Products</h2><p class="muted">No products yet. The next module will let you add products with name, category, price, stock, description and images. Each product will belong to your approved seller account.</p><button class="primary" disabled>ADD PRODUCT — NEXT MODULE</button></div>'}function orders(){document.getElementById('content').innerHTML='<div class="card"><h2>My Orders</h2><p class="muted">Customer orders assigned to this seller will appear here after the real product/order pipeline is connected.</p></div>'}async function profile(){document.getElementById('content').innerHTML='<div class="card"><h2>Business Profile</h2><div class="grid"><div><label>Business Name</label><input id="pBusiness" value="'+esc(seller.business_name)+'"></div><div><label>Owner Name</label><input id="pOwner" value="'+esc(seller.owner_name)+'"></div><div><label>Phone</label><input id="pPhone" value="'+esc(seller.phone)+'"></div><div><label>Category</label><input id="pCategory" value="'+esc(seller.category)+'"></div><div><label>Location</label><input id="pLocation" value="'+esc(seller.location)+'"></div><div><label>Address</label><input id="pAddress" value="'+esc(seller.address)+'"></div></div><label>Description</label><textarea id="pDescription">'+esc(seller.description)+'</textarea><button class="primary" onclick="saveProfile()">SAVE BUSINESS PROFILE</button><div id="profileMsg"></div></div>'}async function saveProfile(){let payload={business_name:document.getElementById('pBusiness').value.trim(),owner_name:document.getElementById('pOwner').value.trim(),phone:document.getElementById('pPhone').value.trim(),category:document.getElementById('pCategory').value.trim(),location:document.getElementById('pLocation').value.trim(),address:document.getElementById('pAddress').value.trim(),description:document.getElementById('pDescription').value.trim()};let q=await sb.from('sellers').update(payload).eq('id',seller.id).eq('auth_user_id',seller.auth_user_id);let e=document.getElementById('profileMsg');e.className=q.error?'error':'success';e.textContent=q.error?'Update failed: '+q.error.message:'Business profile updated successfully.';if(!q.error)seller={...seller,...payload}}function documents(){let docs=Array.isArray(seller.documents)?seller.documents:[];document.getElementById('content').innerHTML='<div class="card"><h2>Business Documents</h2><p class="muted">Your verification documents are stored privately.</p>'+ (docs.length?'<div class="table"><table><tr><th>Document</th><th>File</th><th>Type</th></tr>'+docs.map(d=>'<tr><td>'+esc(d.label)+'</td><td>'+esc(d.name)+'</td><td>'+esc(d.type)+'</td></tr>').join('')+'</table></div>':'<div class="notice">No document records found.</div>')+'</div>'}document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});load();</script></body></html>
