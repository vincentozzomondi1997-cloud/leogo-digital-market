<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LEOGO Admin — Product Approval</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--n:#07152f;--o:#ff7a00;--bg:#f5f7fb;--line:#e5e7eb;--muted:#667085;--g:#166534;--r:#991b1b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:#101828}.wrap{max-width:1200px;margin:auto;padding:18px}.top{background:var(--n);color:#fff}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:24px;font-weight:900}.brand span{color:var(--o)}button{border:0;border-radius:10px;padding:11px 15px;font-weight:900;cursor:pointer}.primary{background:var(--n);color:#fff}.orange{background:var(--o);color:#fff}.light{background:#eef3fb;color:var(--n)}.danger{background:#fee2e2;color:var(--r)}.approve{background:#dcfce7;color:var(--g)}.hidden{display:none!important}.muted{color:var(--muted)}.error,.success{padding:12px;border-radius:10px;margin-top:12px}.error{background:#fef2f2;color:var(--r)}.success{background:#ecfdf3;color:var(--g)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 10px 35px #07152f12}.login{min-height:100vh;display:grid;place-items:center}.login .card{width:min(440px,100%)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button.active{outline:3px solid #ff7a0040}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:1050px}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}.table th{font-size:12px;color:var(--muted)}.pill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900;background:#ffedd5;color:#9a3412}.green{background:#dcfce7;color:#166534}.red{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:6px;flex-wrap:wrap}.empty{text-align:center;padding:35px;color:var(--muted)}input{width:100%;padding:12px;border:1px solid #d7dce4;border-radius:10px;margin:6px 0 12px;font:inherit}.modal{position:fixed;inset:0;background:#0009;z-index:20;display:grid;place-items:center;padding:18px}.modal-card{background:#fff;width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:20px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center}.close{background:#eef3fb;color:var(--n);width:38px;height:38px;padding:0}.detail{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail>div{background:#f8fafc;padding:12px;border-radius:10px}.detail b{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
@media(max-width:700px){.wrap{padding:12px}.card{padding:16px}.detail{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" class="login"><div class="card"><div class="brand">LEO<span>GO</span> DIGITAL SERVICES</div><h2>Admin Product Approval</h2><p class="muted">Authorized LEOGO admin/staff only. This workspace is separate from the customer website.</p><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn" class="primary" style="width:100%" onclick="login()">SIGN IN</button><div id="loginMsg"></div></div></div>
<div id="app" class="hidden"><div class="top"><div class="wrap bar"><div><div class="brand">LEO<span>GO</span> ADMIN</div><small>Product Approval</small></div><button class="light" onclick="logout()">SIGN OUT</button></div></div>
<main class="wrap"><div class="card"><div class="toolbar"><div><h1 style="margin:0">Product Approval</h1><div class="muted">Review seller products before they become visible on the customer marketplace.</div></div><button class="light" onclick="loadProducts()">↻ REFRESH</button></div><div id="pageMsg"></div></div>
<div class="card"><div class="toolbar"><div class="filters"><button id="fPending" class="orange active" onclick="setFilter('pending')">PENDING</button><button id="fApproved" class="light" onclick="setFilter('approved')">APPROVED</button><button id="fRejected" class="light" onclick="setFilter('rejected')">REJECTED</button><button id="fAll" class="light" onclick="setFilter('all')">ALL</button></div><div id="count" class="muted"></div></div><div id="tableArea" style="margin-top:12px"></div></div></main></div>
<div id="viewModal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 style="margin:0">Product Details</h2><button class="close" onclick="closeView()">✕</button></div><div id="details" style="margin-top:16px"></div><div class="actions" style="margin-top:16px"><button id="modalApprove" class="approve" onclick="approveFromModal()">APPROVE</button><button id="modalReject" class="danger" onclick="rejectFromModal()">REJECT</button><button class="light" onclick="closeView()">CLOSE</button></div></div></div>
<script>
const SUPABASE_URL='https://twpiloiiigdghwcdjbnj.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_c4iJwLdRuH85e0XuFnkSjg_mdxLN2fX';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let currentFilter='pending',products=[],selected=null;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showLoginMsg(t,ok=false){const e=document.getElementById('loginMsg');e.className=ok?'success':'error';e.textContent=t}
function showPageMsg(t,ok=false){const e=document.getElementById('pageMsg');e.className=ok?'success':'error';e.textContent=t}
async function identifyAdmin(){const s=await sb.auth.getSession();if(!s.data.session)return false;const u=s.data.session.user;if(!u.email_confirmed_at){await sb.auth.signOut();showLoginMsg('Please verify your email before signing in.');return false}const q=await sb.from('profiles').select('id,role').eq('id',u.id).maybeSingle();if(q.error){await sb.auth.signOut();showLoginMsg('Admin profile could not be loaded: '+q.error.message);return false}if(!q.data){await sb.auth.signOut();showLoginMsg('No LEOGO staff profile is linked to this account.');return false}const role=String(q.data.role||'').toLowerCase();if(!['admin','manager','supervisor','staff'].includes(role)){await sb.auth.signOut();showLoginMsg('Access denied. This account is not authorized for product approval.');return false}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await runAuthDiagnostic();await loadProducts();return true}
async function runAuthDiagnostic(){const s=await sb.auth.getSession();const sess=s.data.session;if(!sess){showPageMsg('AUTH DIAGNOSTIC: No browser session found.');return}const a=await sb.rpc('leogo_debug_current_auth');const m=await sb.rpc('leogo_debug_moderation_context');if(a.error){showPageMsg('AUTH DIAGNOSTIC RPC FAILED: '+a.error.message);return}if(m.error){showPageMsg('MODERATION CONTEXT RPC FAILED: '+m.error.message);return}showPageMsg('AUTH DIAGNOSTIC: '+JSON.stringify({current_auth:a.data,moderation_context:m.data}));}
async function login(){const b=document.getElementById('loginBtn');b.disabled=true;b.textContent='SIGNING IN…';const r=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(r.error)showLoginMsg(r.error.message);else await identifyAdmin();b.disabled=false;b.textContent='SIGN IN'}
async function logout(){await sb.auth.signOut();location.reload()}
function setFilter(f){currentFilter=f;['Pending','Approved','Rejected','All'].forEach(x=>document.getElementById('f'+x).classList.remove('active'));document.getElementById('f'+f[0].toUpperCase()+f.slice(1)).classList.add('active');render()}
async function loadProducts(){const area=document.getElementById('tableArea');area.innerHTML='<div class="empty">Loading products…</div>';const q=await sb.from('products').select('id,seller_id,name,category,description,price,stock_qty,image_url,available,approved,approval_status,created_at,updated_at,sellers(business_name,owner_name,email,status)').order('created_at',{ascending:false});if(q.error){area.innerHTML='<div class="error">Could not load products: '+esc(q.error.message)+'</div>';return}products=q.data||[];render()}
function render(){const list=currentFilter==='all'?products:products.filter(p=>String(p.approval_status|| (p.approved?'approved':'pending')).toLowerCase()===currentFilter);document.getElementById('count').textContent=list.length+' product'+(list.length===1?'':'s');if(!list.length){document.getElementById('tableArea').innerHTML='<div class="empty">No '+currentFilter+' products found.</div>';return}document.getElementById('tableArea').innerHTML='<div class="table-wrap"><table class="table"><thead><tr><th>Product</th><th>Seller</th><th>Category</th><th>Price</th><th>Stock</th><th>Available</th><th>Approval</th><th>Created</th><th>Action</th></tr></thead><tbody>'+list.map(p=>{const s=Array.isArray(p.sellers)?p.sellers[0]:p.sellers;const ap=p.approval_status|| (p.approved?'approved':'pending');return '<tr><td><b>'+esc(p.name)+'</b><br><span class="muted">'+esc((p.description||'').slice(0,90))+'</span></td><td><b>'+esc(s?.business_name||'Unknown seller')+'</b><br>'+esc(s?.owner_name||'')+'</td><td>'+esc(p.category)+'</td><td>KSh '+Number(p.price||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+'</td><td>'+esc(p.stock_qty??0)+'</td><td><span class="pill '+(p.available?'green':'red')+'">'+(p.available?'available':'unavailable')+'</span></td><td><span class="pill '+(ap==='approved'?'green':ap==='rejected'?'red':'')+'">'+esc(ap)+'</span></td><td>'+new Date(p.created_at).toLocaleString()+'</td><td><div class="actions"><button class="light" onclick="viewProduct(\''+p.id+'\')">VIEW</button>'+(ap==='pending'?'<button class="approve" onclick="changeApproval(\''+p.id+'\',\'approved\')">APPROVE</button><button class="danger" onclick="changeApproval(\''+p.id+'\',\'rejected\')">REJECT</button>':'')+'</div></td></tr>'}).join('')+'</tbody></table></div>'}
function viewProduct(id){selected=products.find(p=>p.id===id);if(!selected)return;const s=Array.isArray(selected.sellers)?selected.sellers[0]:selected.sellers;const ap=selected.approval_status|| (selected.approved?'approved':'pending');document.getElementById('details').innerHTML='<div class="detail"><div><b>Product</b>'+esc(selected.name)+'</div><div><b>Seller</b>'+esc(s?.business_name||'Unknown')+'</div><div><b>Owner</b>'+esc(s?.owner_name||'')+'</div><div><b>Seller Email</b>'+esc(s?.email||'')+'</div><div><b>Category</b>'+esc(selected.category)+'</div><div><b>Price</b>KSh '+Number(selected.price||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+'</div><div><b>Stock</b>'+esc(selected.stock_qty??0)+'</div><div><b>Available</b>'+esc(selected.available)+'</div><div><b>Approval Status</b>'+esc(ap)+'</div><div><b>Created</b>'+new Date(selected.created_at).toLocaleString()+'</div></div><div class="card" style="margin-top:14px;margin-bottom:0"><b>Description</b><div style="margin-top:6px">'+esc(selected.description||'No description provided.')+'</div></div>'+(selected.image_url?'<p><b>Image:</b> <a href="'+esc(selected.image_url)+'" target="_blank" rel="noopener">Open product image</a></p>':'');const pending=ap==='pending';document.getElementById('modalApprove').classList.toggle('hidden',!pending);document.getElementById('modalReject').classList.toggle('hidden',!pending);document.getElementById('viewModal').classList.remove('hidden')}
function closeView(){document.getElementById('viewModal').classList.add('hidden');selected=null}
async function approveFromModal(){if(selected)await changeApproval(selected.id,'approved',true)}
async function rejectFromModal(){if(selected)await changeApproval(selected.id,'rejected',true)}
async function changeApproval(id,status,fromModal=false){const p=products.find(x=>x.id===id);if(!p)return;const ap=p.approval_status|| (p.approved?'approved':'pending');if(ap!=='pending'){showPageMsg('Only Pending products can be approved or rejected.');return}const word=status==='approved'?'approve':'reject';if(!confirm('Are you sure you want to '+word+' “'+p.name+'”?'))return;const q=await sb.rpc('leogo_moderate_product',{p_product_id:id,p_status:status});if(q.error){showPageMsg('Approval update failed: '+q.error.message);return}if(!q.data){showPageMsg('Approval update made no change. The product was not updated.');return}if(fromModal)closeView();showPageMsg('Product '+status+' successfully.',true);await loadProducts()}
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});identifyAdmin();
</script></body></html>
