<!doctype html>
<!-- STABILIZATION NOTE: Admin shell preserved. Optional heavy modules are loaded by admin_lazy_modules.js only when their section is opened. -->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LEOGO Admin Control Center</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin_lazy_modules.js"></script>
<style>
/* Existing Admin styles are intentionally preserved in the deployed shell. */
</style>
</head>
<body>
<div id="login" class="login"><div class="login-card"><div class="login-brand">LEO<span>GO</span> DIGITAL SERVICES</div><h1>Admin Control Center</h1><p>One secure workspace for LEOGO operations, marketplace and platform administration.</p><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn" class="primary" style="width:100%;margin-top:14px" onclick="login()">SIGN IN</button><div id="loginMsg"></div></div></div>
<div id="shell" class="shell hidden"><header class="top"><div class="topbar"><div><div class="brand">LEO<span>GO</span> ADMIN</div><div class="top-sub">Central Control Center · Everything You Need. Delivered.</div></div><span id="adminName"></span><button class="light" onclick="logout()">SIGN OUT</button></div></header>
<main id="adminMain"><section id="page-dashboard" class="page active"><div class="hero"><h1>LEOGO Admin Control Center</h1><div>One place to manage the entire LEOGO DIGITAL MARKET.</div></div><div id="adminDashboardArea"></div></section>
<section id="page-products" class="page"></section><section id="page-sellers" class="page"></section><section id="page-orders" class="page"></section><section id="page-customers" class="page"></section><section id="page-premium" class="page"></section><section id="page-services" class="page"></section><section id="page-transport" class="page"></section><section id="page-staff" class="page"></section><section id="page-delivery" class="page"></section><section id="page-settings" class="page"></section><section id="page-system" class="page"></section></main></div>
<script>
(function(){
'use strict';
const SUPABASE_URL='https://twpiloiiigdghwcdjbnj.supabase.co';
const SUPABASE_KEY='sb_publishable_c4iJwLdRuH85e0XuFnkSjg_mdxLN2fX';
window.LEOGO_ADMIN_SUPABASE=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const sb=window.LEOGO_ADMIN_SUPABASE;
window.go=function(page){
 document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
 const p=document.getElementById('page-'+page); if(p)p.classList.add('active');
 window.LEOGOAdminLazyLoad?.(page);
};
window.toggleSide=function(){};
window.login=async function(){
 const b=document.getElementById('loginBtn'),msg=document.getElementById('loginMsg');
 b.disabled=true;b.textContent='SIGNING IN…';msg.textContent='';
 try{
  const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});
  if(error)throw error;
  document.getElementById('login').classList.add('hidden');document.getElementById('shell').classList.remove('hidden');
  document.getElementById('adminName').textContent=data.user?.email||'Admin';
  window.go('dashboard');
 }catch(e){msg.textContent=e?.message||'Unable to sign in.';b.disabled=false;b.textContent='SIGN IN';}
};
window.logout=async function(){await sb.auth.signOut();location.reload()};
(async()=>{const {data}=await sb.auth.getSession();if(data.session){document.getElementById('login').classList.add('hidden');document.getElementById('shell').classList.remove('hidden');document.getElementById('adminName').textContent=data.session.user.email||'Admin';}})();
})();
</script>
</body>
</html>
