name: Install unified Premium hub
on:
  push:
    paths:
      - 'premium_hub.js'
      - 'premium_profiles_catalogue.js'
      - 'premium_discovery.js'
      - '.github/workflows/install_premium_hub.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect unified Premium hub
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_script(path, filename, tag):
              p=Path(path); s=p.read_text(encoding='utf-8')
              s=re.sub(r'<script[^>]+src=["\']'+filename+r'(?:\?[^"\']*)?["\'][^>]*></script>\s*','',s,flags=re.I)
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')

          replace_script('index.html',r'premium_hub\.js','<script src="premium_hub.js?v=20260914-2"></script>')
          replace_script('premium.html',r'premium_profiles_catalogue\.js','<script src="premium_profiles_catalogue.js?v=20260914-3"></script>')
          replace_script('premium.html',r'premium_hub\.js','<script src="premium_hub.js?v=20260914-2"></script>')

          p=Path('premium_discovery.js'); s=p.read_text(encoding='utf-8')
          if 'window.LEOGOPremiumDiscovery={open:openDiscovery};' not in s:
              s=s.replace('function loadAcceptanceModule()', 'window.LEOGOPremiumDiscovery={open:openDiscovery};\n  function loadAcceptanceModule()', 1)
          old="const q=await sb.rpc('get_premium_profiles_public');"
          new="let q=await sb.rpc('get_premium_profile_catalogue'); if(q.error) q=await sb.rpc('get_premium_profiles_public');"
          if old in s and new not in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          test "$(grep -o 'premium_hub.js' index.html | wc -l)" -eq 1
          test "$(grep -o 'premium_profiles_catalogue.js' premium.html | wc -l)" -eq 1
      - name: Commit installation
        run: |
          git config user.name "LEOGO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html premium.html premium_discovery.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Connect all Premium customer entry points"
            git push
          fi
