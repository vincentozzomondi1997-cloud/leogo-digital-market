name: Remove deprecated Premium customer discovery status
on:
  push:
    paths:
      - 'premium_customer_discovery_status.js'
      - '.github/workflows/install_premium_customer_discovery_status.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove deprecated discovery status script from customer page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script[^>]+premium_customer_discovery_status\.js[^>]*></script>\s*', '', s, flags=re.I)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit removal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Remove deprecated Premium discovery contact UI'
          git push
