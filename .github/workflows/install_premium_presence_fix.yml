name: Install Premium availability and online presence fixes
on:
  push:
    paths:
      - premium_owner_availability_presence_fix.js
      - premium_customer_online_status.js
      - .github/workflows/install_premium_presence_fix.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Premium owner fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('premium_profile_owner_dashboard.html')
          text=p.read_text(encoding='utf-8')
          text=re.sub(r'\s*<script\s+src="premium_owner_availability_presence_fix\.js(?:\?v=[^"]+)?"\s*></script>','',text)
          tag='<script src="premium_owner_availability_presence_fix.js?v=20260914-1"></script>'
          text=text.replace('</body>',tag+'\n</body>',1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Install Premium customer online status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          text=re.sub(r'\s*<script\s+src="premium_customer_online_status\.js(?:\?v=[^"]+)?"\s*></script>','',text)
          tag='<script src="premium_customer_online_status.js?v=20260914-1"></script>'
          text=text.replace('</body>',tag+'\n</body>',1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'premium_owner_availability_presence_fix.js?v=20260914-1' premium_profile_owner_dashboard.html
          grep -q 'premium_customer_online_status.js?v=20260914-1' index.html
      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'LEOGO Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add premium_profile_owner_dashboard.html index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Connect Premium availability and online status'
          git push
