name: Patch admin login guard
on:
  push:
    paths:
      - 'admin_login_guard.js'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject guard into admin page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text()
          tag='<script src="admin_login_guard.js"></script>'
          if tag not in s:
              s=s.replace('</head>', tag+'\n</head>', 1)
              p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git diff --cached --quiet || git commit -m 'Repair admin sign in button'
          git push
