name: Install LEOGO Premium profile view
on:
  push:
    paths:
      - premium_profile_view.js
      - .github/workflows/install_premium_profile_view.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Premium profile view on customer website
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          if not p.exists():
              raise SystemExit('index.html not found')
          text=p.read_text(encoding='utf-8')
          text=re.sub(r'<script src="premium_profile_view\\.js\\?v=[^"]+"></script>', '', text)
          tag='<script src="premium_profile_view.js?v=20260913-1"></script>'
          if '</body>' not in text:
              raise SystemExit('index.html has no closing body tag')
          text=text.replace('</body>',tag+'\n</body>',1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name 'LEOGO Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add Premium customer profile view and gallery access'
          git push
