name: Install LEOGO Premium profile view
on:
  push:
    paths:
      - premium_profile_view.js
      - premium_profile_view_attach.js
      - .github/workflows/install_premium_profile_view.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Premium profile view scripts on customer website
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          if not p.exists():
              raise SystemExit('index.html not found')
          text=p.read_text(encoding='utf-8')
          text=re.sub(r'<script src="premium_profile_view\\.js\\?v=[^"]+"></script>', '', text)
          text=re.sub(r'<script src="premium_profile_view_attach\\.js\\?v=[^"]+"></script>', '', text)
          tags='\n'.join([
            '<script src="premium_profile_view.js?v=20260913-2"></script>',
            '<script src="premium_profile_view_attach.js?v=20260913-1"></script>'
          ])
          if '</body>' not in text:
              raise SystemExit('index.html has no closing body tag')
          text=text.replace('</body>',tags+'\n</body>',1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name 'LEOGO Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix Premium View Profile button integration'
          git push
