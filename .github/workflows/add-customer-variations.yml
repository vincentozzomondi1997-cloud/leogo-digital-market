name: Add customer product variations
on:
  push:
    paths:
      - '.github/workflows/add-customer-variations.yml'
      - 'tools/patch_customer_variations.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and validate variation patch
        run: |
          python3 tools/patch_customer_variations.py
          grep -q 'function attachVariationInfo' index.html
          grep -q 'function chooseVariation' index.html
          grep -q 'product_id:x.product_id||x.id' index.html
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m 'Add customer product variation selection'
          git push
          rm -f .github/workflows/add-customer-variations.yml tools/patch_customer_variations.py
          git add .github/workflows/add-customer-variations.yml tools/patch_customer_variations.py
          git commit -m 'Remove temporary customer variation patch files'
          git push
