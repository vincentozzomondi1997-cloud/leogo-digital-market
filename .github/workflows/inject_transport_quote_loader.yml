name: Inject transport quote loader
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, '[skip transport quote loader]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject loader
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','admin.html']:
              p=Path(name)
              text=p.read_text(encoding='utf-8')
              tag='<script src="transport_quote_workflow.js"></script>'
              if tag not in text:
                  marker='</body>'
                  if marker not in text:
                      raise SystemExit(f'No body marker in {name}')
                  text=text.replace(marker, tag+'\n'+marker, 1)
                  p.write_text(text,encoding='utf-8')
          PY
      - name: Commit loader injection
        run: |
          git config user.name 'LEOGO Development Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html admin.html
          git diff --cached --quiet || git commit -m 'Load transport quote workflow [skip transport quote loader]'
          git push
