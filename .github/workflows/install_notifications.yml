name: Install LEOGO notification center
on:
  push:
    paths:
      - notifications.js
      - .github/workflows/install_notifications.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update notification center on role pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pages = [
              'index.html',
              'admin.html',
              'seller_dashboard.html',
              'seller_products.html',
              'provider_dashboard.html',
              'premium_profile_dashboard.html',
              'premium_profile_owner_dashboard.html',
          ]
          new_tag = '<script src="notifications.js?v=20260913"></script>'
          changed = []
          for name in pages:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              import re
              text2 = re.sub(r'<script\s+src=["\']notifications\.js(?:\?[^"\']*)?["\']\s*></script>', new_tag, text, count=1)
              if text2 != text:
                  p.write_text(text2, encoding='utf-8')
                  changed.append(name)
                  continue
              marker = '</body>'
              if marker not in text:
                  continue
              text = text.replace(marker, new_tag + '\n' + marker, 1)
              p.write_text(text, encoding='utf-8')
              changed.append(name)
          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit notification integration
        shell: bash
        run: |
          git config user.name 'LEOGO Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html admin.html seller_dashboard.html seller_products.html provider_dashboard.html premium_profile_dashboard.html premium_profile_owner_dashboard.html
          if git diff --cached --quiet; then
            echo 'No page changes required.'
            exit 0
          fi
          git commit -m 'Refresh notification center integration'
          git push