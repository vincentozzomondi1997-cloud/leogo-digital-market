name: LEOGO Mobile Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-mobile-account:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply only the two mobile routing fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old1 = '<button class="btn orange" onclick="openAuth()">Shop Now</button>'
          new1 = '<button class="btn orange" onclick="session?goHome():openAuth()">Shop Now</button>'
          old2 = '<button onclick="openAuth()">👤<strong>Account</strong></button>'
          new2 = '<button onclick="handleAccountClick()">👤<strong>Account</strong></button>'
          if s.count(old1) != 1:
              raise SystemExit(f'Expected exactly one Shop Now target, found {s.count(old1)}')
          if s.count(old2) != 1:
              raise SystemExit(f'Expected exactly one mobile Account target, found {s.count(old2)}')
          s = s.replace(old1, new1).replace(old2, new2)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify file integrity and commit
        run: |
          test -s index.html
          grep -Fq 'onclick="session?goHome():openAuth()">Shop Now</button>' index.html
          grep -Fq '<button onclick="handleAccountClick()">👤<strong>Account</strong></button>' index.html
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/leogo-mobile-fix.yml
          git rm .github/workflows/leogo-mobile-fix.yml
          git commit -m "Fix mobile account and Shop Now routing"
          git push
