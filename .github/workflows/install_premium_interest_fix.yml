name: Install Premium customer interest fix
on:
  push:
    paths:
      - premium_interest_submission_fix.js
      - .github/workflows/install_premium_interest_fix.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install interest submission bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          text=re.sub(r'\s*<script\s+src="premium_interest_submission_fix\.js(?:\?v=[^"]+)?"\s*></script>','',text)
          tag='<script src="premium_interest_submission_fix.js?v=20260914-1"></script>'
          text=text.replace('</body>',tag+'\n</body>',1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: grep -q 'premium_interest_submission_fix.js?v=20260914-1' index.html
      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'LEOGO Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Connect Premium interest submission fix'
          git push
