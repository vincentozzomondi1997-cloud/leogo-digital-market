name: Install Premium customer connection status
on:
  push:
    paths:
      - premium_customer_connection_status.js
      - .github/workflows/install_premium_customer_connection_status.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install customer connection status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          text=re.sub(r'\s*<script\s+src="premium_customer_connection_status\.js(?:\?v=[^"]+)?"\s*></script>','',text)
          tag='<script src="premium_customer_connection_status.js?v=20260914-2"></script>'
          if '</body>' not in text:
              raise SystemExit('index.html has no closing body tag')
          text=text.replace('</body>',tag+'\n</body>',1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: test "$(grep -o 'premium_customer_connection_status.js?v=' index.html | wc -l | tr -d ' ')" = "1" && grep -q 'premium_customer_connection_status.js?v=20260914-2' index.html
      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'LEOGO Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Install stable Premium customer connection status'
          git push
