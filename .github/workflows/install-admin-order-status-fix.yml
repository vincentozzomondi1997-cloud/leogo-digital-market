name: Install admin order status fix
on:
  push:
    branches: [main]
    paths:
      - admin_order_status_fix.js
      - .github/workflows/install-admin-order-status-fix.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install order status fix without touching other modules
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="admin_order_status_fix.js"></script>'
          if tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('admin.html does not contain </body>')
              text = text.replace(marker, tag + '\n' + marker, 1)
              p.write_text(text, encoding='utf-8')
          PY
          git rm -f .github/workflows/install-admin-order-status-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "fix: enable live admin order status updates"
          git push
