name: Repair Premium customer entry buttons only
on:
  push:
    paths:
      - '.github/workflows/repair_premium_customer_entrypoints.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only customer Premium entry points
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # index.html: make the existing customer Premium entry function a
          # pure gateway to the already-working canonical Premium page.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=re.search(r'function openPremium\(\)\{.*?\n\}\nasync function premiumAction',s,re.S)
          if not old:
              raise SystemExit('Could not locate the existing openPremium gateway')
          new='''function openPremium(){\n  window.location.href="premium.html";\n}\nasync function premiumAction'''
          s=s[:old.start()]+new+s[old.end():]

          # The existing category renderer must send the Premium category to
          # the same canonical page instead of the retired legacy category UI.
          marker='function filterCategory(c){\n'
          guard='function filterCategory(c){\n  if(c==="LEOGO Premium 18+"){window.location.href="premium.html";return;}\n'
          if marker not in s:
              raise SystemExit('Could not locate filterCategory')
          if guard not in s:
              s=s.replace(marker,guard,1)
          p.write_text(s,encoding='utf-8')

          # premium_category_bridge.js: keep the category integration as a
          # simple gateway too. Do not load, replace, or alter Premium data.
          p=Path('premium_category_bridge.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("""  function openPremium(){\n    if(window.LEOGOPremiumHub && typeof window.LEOGOPremiumHub.open==='function'){\n      window.LEOGOPremiumHub.open();\n      return;\n    }\n    window.location.href='premium.html';\n  }""","""  function openPremium(){\n    window.location.href='premium.html';\n  }""")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify only entry-point wiring changed
        run: |
          grep -q 'function openPremium(){' index.html
          grep -q 'window.location.href="premium.html"' index.html
          grep -q 'if(c==="LEOGO Premium 18+")' index.html
          grep -q "window.location.href='premium.html'" premium_category_bridge.js
      - name: Commit customer entry-point repair
        run: |
          git config user.name "LEOGO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html premium_category_bridge.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Route customer Premium buttons to canonical Premium page"
            git push
          fi
