name: Repair Premium customer entry buttons only
on:
  push:
    paths:
      - '.github/workflows/repair_premium_customer_entrypoints.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only customer Premium entry points
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Customer website only: route Premium entry buttons to the
          # already-working Premium system in premium_section.js.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=re.search(r'function openPremium\(\)\{.*?\n\}\nasync function premiumAction',s,re.S)
          if not old:
              raise SystemExit('Could not locate the existing openPremium gateway')
          new='''function openPremium(){
  const open=window.LEOGOPremiumSection?.open;
  if(typeof open==='function'){open();return;}
  const button=document.getElementById('leogoPremiumOpen');
  if(button){button.click();return;}
  setTimeout(()=>{
    const retry=window.LEOGOPremiumSection?.open;
    if(typeof retry==='function')retry();
    else document.getElementById('leogoPremiumOpen')?.click();
  },300);
}
async function premiumAction'''
          s=s[:old.start()]+new+s[old.end():]

          # Premium category card: use the exact same existing Premium gateway.
          marker='function filterCategory(c){\n'
          guard='function filterCategory(c){\n  if(c==="LEOGO Premium 18+"){openPremium();return;}\n'
          if marker not in s:
              raise SystemExit('Could not locate filterCategory')
          if guard not in s:
              s=s.replace(marker,guard,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify only customer entry-point wiring changed
        run: |
          grep -q 'function openPremium(){' index.html
          grep -q 'window.LEOGOPremiumSection?.open' index.html
          grep -q 'if(c==="LEOGO Premium 18+"){openPremium();return;}' index.html
          grep -q 'premium_section.js' index.html
          grep -q 'premium_category_bridge.js' index.html
          grep -q 'premium_site_bridge.js' index.html
      - name: Commit customer entry-point repair
        run: |
          git config user.name "LEOGO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Connect customer Premium buttons to existing Premium system"
            git push
          fi
