name: Restore LEOGO customer index

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact known-good index
        shell: bash
        run: |
          set -e
          git fetch origin 976ad4c564c0dde204aae968849a030eab503731 --no-tags
          git cat-file -p d2c5ff7bda0a6eb3fd95988d447fd9d0576a3b12 > index.html
          test "$(git hash-object index.html)" = "d2c5ff7bda0a6eb3fd95988d447fd9d0576a3b12"

      - name: Commit restored file and remove temporary workflow
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/restore-leogo-index.yml
          git add index.html
          git commit -m "Restore LEOGO customer site baseline"
          git push
