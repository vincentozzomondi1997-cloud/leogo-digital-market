name: Restore Admin Clean Flow
on:
  push:
    paths:
      - 'restore-admin-clean.trigger'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary Admin integrations
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          text=p.read_text(encoding='utf-8')
          for marker in [
              '<script src="admin_login_guard.js"></script>',
              '<script src="admin_premium_management.js"></script>',
              '<script src="admin_premium_acceptance_loader.js"></script>'
          ]:
              text=text.replace(marker,'')
          p.write_text(text,encoding='utf-8')
          t=Path('restore-admin-clean.trigger')
          if t.exists(): t.unlink()
          Path('.github/workflows/restore-admin-clean.yml').unlink()
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html restore-admin-clean.trigger .github/workflows/restore-admin-clean.yml
          git diff --cached --quiet || git commit -m 'Restore original Admin dashboard flow'
          git push
