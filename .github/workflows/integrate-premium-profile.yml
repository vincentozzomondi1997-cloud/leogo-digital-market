name: Integrate Premium profile

on:
  push:
    paths:
      - 'premium_profile_trigger.txt'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Premium profile loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="premium_profile.js"></script>'
          if tag not in s:
              anchor = '</body>'
              if anchor not in s:
                  raise SystemExit('Body closing tag not found')
              s = s.replace(anchor, tag + '\n' + anchor, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit Premium profile loader
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Load Premium profile manager on customer website'
          git push
