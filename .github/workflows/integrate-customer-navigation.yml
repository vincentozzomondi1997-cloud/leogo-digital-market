name: Integrate customer category navigation
on:
  push:
    paths:
      - 'integrate_customer_navigation.trigger'
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add navigation bridge to customer website
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="customer_navigation.js"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit('index.html has no closing body tag; no change made.')
              s=s.replace(marker, tag+'\n'+marker, 1)
              p.write_text(s)
          PY
          rm -f integrate_customer_navigation.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html integrate_customer_navigation.trigger
          git diff --cached --quiet || git commit -m 'Connect customer category and dashboard navigation'
          git push
