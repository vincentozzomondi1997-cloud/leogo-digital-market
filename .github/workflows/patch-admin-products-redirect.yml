name: Patch admin products redirect
on:
  push:
    paths:
      - 'patch_admin_products_redirect.trigger'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Redirect legacy product login to admin dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin_products.html')
          s=p.read_text()
          old="if(r.error)showLoginMsg(r.error.message);else await identifyAdmin();b.disabled=false;b.textContent='SIGN IN'"
          new="if(r.error)showLoginMsg(r.error.message);else { window.location.href='admin.html'; return; }b.disabled=false;b.textContent='SIGN IN'"
          if old not in s:
              raise SystemExit('Expected login code not found; no change made.')
          p.write_text(s.replace(old,new,1))
          PY
          rm -f patch_admin_products_redirect.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin_products.html patch_admin_products_redirect.trigger
          git diff --cached --quiet || git commit -m 'Return admin product login to control center'
          git push
