name: Connect Service Marketplace

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  connect:
    if: ${{ !contains(github.event.head_commit.message, '[service-marketplace-connect]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add isolated service marketplace loader
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          marker='<script src="service_marketplace.js"></script>'
          if marker not in text:
              needle='</body>'
              if needle not in text:
                  raise SystemExit('index.html closing body tag not found; no changes made')
              text=text.replace(needle, marker+'\n'+needle, 1)
              p.write_text(text, encoding='utf-8')
              print('Service marketplace loader added.')
          else:
              print('Service marketplace loader already present; no change.')
          PY
      - name: Commit isolated loader
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Connect service marketplace to customer site [service-marketplace-connect]'
          git push
