name: LEOGO Product Variations Update
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add product variations to seller page
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('seller_products.html')
          s=p.read_text()
          s=s.replace('.progress i{display:block;height:100%;width:0;background:var(--o)}', '.progress i{display:block;height:100%;width:0;background:var(--o)}.variationBox{border:1px solid var(--line);border-radius:12px;padding:14px;margin:6px 0 12px}.variationHead{display:flex;justify-content:space-between;align-items:center;gap:10px}.variationRow{display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:8px;align-items:end;margin-top:10px}.variationRow input{margin:0}.removeVar{background:#fee2e2;color:#991b1b;padding:10px 12px}@media(max-width:650px){.variationRow{grid-template-columns:1fr 1fr}.removeVar{grid-column:2}}')
          old='''<div class="grid"><div><label>Price (KSh) *</label><input id="pPrice" type="number" min="0" step="0.01" required placeholder="0.00"></div><div><label>Stock Quantity *</label><input id="pStock" type="number" min="0" step="1" required placeholder="0"></div></div><label>Product Image</label>'''
          new='''<div class="grid"><div><label id="priceLabel">Price (KSh) *</label><input id="pPrice" type="number" min="0" step="0.01" required placeholder="0.00"></div><div><label id="stockLabel">Stock Quantity *</label><input id="pStock" type="number" min="0" step="1" required placeholder="0"></div></div><div class="variationBox"><div class="variationHead"><div><b>Product Variations</b><div class="small muted">Optional. Example: Coca-Cola, Fanta, Sprite, Stoney.</div></div><label style="font-size:13px"><input id="useVariations" type="checkbox" style="width:auto;margin:0 5px 0 0" onchange="toggleVariations()"> Use variations</label></div><div id="variationArea" class="hidden"><div id="variationRows"></div><button type="button" class="light" style="margin-top:10px" onclick="addVariation()">＋ ADD VARIATION</button><div class="small muted" style="margin-top:8px">Each variation can have its own price and stock. Customers will choose the variation when ordering.</div></div></div><label>Product Image</label>'''
          if old not in s: raise SystemExit('form marker not found')
          s=s.replace(old,new,1)
          s=s.replace("let sb=null,seller=null,editingId=null,editingImageUrl=null;", "let sb=null,seller=null,editingId=null,editingImageUrl=null,variations=[];")
          marker="function resetImage(){"
          funcs='''function toggleVariations(){const on=document.getElementById('useVariations').checked;document.getElementById('variationArea').classList.toggle('hidden',!on);document.getElementById('priceLabel').textContent=on?'Default Price (KSh) *':'Price (KSh) *';document.getElementById('stockLabel').textContent=on?'Total Stock (auto if variations added)':'Stock Quantity *';if(on&&!document.querySelector('.variationRow'))addVariation()}\nfunction addVariation(v={name:'',price:'',stock:'',available:true}){const row=document.createElement('div');row.className='variationRow';row.innerHTML='<div><label>Variation</label><input class="vName" required maxlength="100" placeholder="e.g. Coca-Cola"></div><div><label>Price (KSh)</label><input class="vPrice" type="number" min="0" step="0.01" required placeholder="40"></div><div><label>Stock</label><input class="vStock" type="number" min="0" step="1" required placeholder="20"></div><button type="button" class="removeVar" onclick="this.parentElement.remove()">REMOVE</button>';document.getElementById('variationRows').appendChild(row);row.querySelector('.vName').value=v.name||'';row.querySelector('.vPrice').value=v.price??'';row.querySelector('.vStock').value=v.stock??0}\nfunction clearVariations(){document.getElementById('variationRows').innerHTML='';variations=[]}\nfunction readVariations(){return [...document.querySelectorAll('#variationRows .variationRow')].map(r=>({name:r.querySelector('.vName').value.trim(),price:Number(r.querySelector('.vPrice').value),stock:Number(r.querySelector('.vStock').value),available:true})).filter(v=>v.name)}\nasync function loadVariations(productId){const q=await sb.from('product_variations').select('*').eq('product_id',productId).order('created_at',{ascending:true});if(q.error)throw Error('Could not load variations: '+q.error.message);return q.data||[]}\nasync function saveVariations(productId){const use=document.getElementById('useVariations').checked;const current=use?readVariations():[];if(use&&!current.length)throw Error('Add at least one variation or turn off Use variations.');const del=await sb.from('product_variations').delete().eq('product_id',productId);if(del.error)throw Error('Could not replace variations: '+del.error.message);if(current.length){const ins=await sb.from('product_variations').insert(current.map(v=>({...v,product_id:productId})));if(ins.error)throw Error('Could not save variations: '+ins.error.message)}}\n'''
          if marker not in s: raise SystemExit('script marker not found')
          s=s.replace(marker,funcs+marker,1)
          s=s.replace("function openAdd(){editingId=null;editingImageUrl=null;document.getElementById('modalTitle').textContent='Add Product';document.getElementById('productForm').reset();document.getElementById('formMsg').textContent='';document.getElementById('saveBtn').textContent='SAVE PRODUCT';resetImage();document.getElementById('productModal').classList.remove('hidden')}", "function openAdd(){editingId=null;editingImageUrl=null;document.getElementById('modalTitle').textContent='Add Product';document.getElementById('productForm').reset();document.getElementById('formMsg').textContent='';document.getElementById('saveBtn').textContent='SAVE PRODUCT';resetImage();clearVariations();document.getElementById('useVariations').checked=false;toggleVariations();document.getElementById('productModal').classList.remove('hidden')}")
          old_edit="document.getElementById('pStock').value=p.stock_qty??0;document.getElementById('productForm').reset();document.getElementById('pName').value=p.name||'';document.getElementById('pCategory').value=p.category||'';document.getElementById('pDescription').value=p.description||'';document.getElementById('pPrice').value=p.price??'';document.getElementById('pStock').value=p.stock_qty??0;document.getElementById('formMsg').textContent='';document.getElementById('saveBtn').textContent='UPDATE PRODUCT';resetImage();"
          new_edit="document.getElementById('pStock').value=p.stock_qty??0;document.getElementById('productForm').reset();document.getElementById('pName').value=p.name||'';document.getElementById('pCategory').value=p.category||'';document.getElementById('pDescription').value=p.description||'';document.getElementById('pPrice').value=p.price??'';document.getElementById('pStock').value=p.stock_qty??0;document.getElementById('formMsg').textContent='';document.getElementById('saveBtn').textContent='UPDATE PRODUCT';resetImage();clearVariations();const vv=await loadVariations(p.id);document.getElementById('useVariations').checked=vv.length>0;toggleVariations();vv.forEach(v=>addVariation({name:v.name,price:v.price,stock:v.stock_qty,available:v.available}));"
          if old_edit not in s: raise SystemExit('edit marker not found')
          s=s.replace(old_edit,new_edit,1)
          old_save="const image_url=await uploadImage(f),payload={name:document.getElementById('pName').value.trim(),category:document.getElementById('pCategory').value,description:document.getElementById('pDescription').value.trim(),price:Number(document.getElementById('pPrice').value),stock_qty:Number(document.getElementById('pStock').value),image_url,available:true};let q=editingId?await sb.from('products').update(payload).eq('id',editingId).eq('seller_id',seller.id):await sb.from('products').insert({...payload,seller_id:seller.id,approved:false,approval_status:'pending'});if(q.error)throw Error(q.error.message);closeProduct();"
          new_save="const use=document.getElementById('useVariations').checked,current=use?readVariations():[];if(use&&!current.length)throw Error('Add at least one variation or turn off Use variations.');const derivedPrice=use&&current.length?Math.min(...current.map(v=>v.price)):Number(document.getElementById('pPrice').value),derivedStock=use&&current.length?current.reduce((a,v)=>a+v.stock,0):Number(document.getElementById('pStock').value),image_url=await uploadImage(f),payload={name:document.getElementById('pName').value.trim(),category:document.getElementById('pCategory').value,description:document.getElementById('pDescription').value.trim(),price:derivedPrice,stock_qty:derivedStock,image_url,available:true};let q;if(editingId){q=await sb.from('products').update(payload).eq('id',editingId).eq('seller_id',seller.id);if(!q.error)await saveVariations(editingId)}else{q=await sb.from('products').insert({...payload,seller_id:seller.id,approved:false,approval_status:'pending'}).select('id').single();if(!q.error)await saveVariations(q.data.id)}if(q.error)throw Error(q.error.message);closeProduct();"
          if old_save not in s: raise SystemExit('save marker not found')
          s=s.replace(old_save,new_save,1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add seller_products.html
          git commit -m 'Add seller product variations' || exit 0
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/leogo-variations-fix.yml
          git commit -m 'Remove temporary variations workflow'
          git push
