name: Fix seller owner ID
on:
  push:
    paths:
      - 'seller_products.html'
      - '.github/workflows/fix-seller-owner.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix seller_id
        run: |
          sed -i 's/seller_id:seller.auth_user_id/seller_id:seller.id/g; s/seller_id: seller.auth_user_id/seller_id: seller.id/g; s/seller_id:seller?.auth_user_id/seller_id:seller.id/g; s/seller_id: seller?.auth_user_id/seller_id: seller.id/g' seller_products.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add seller_products.html
          git diff --cached --quiet || git commit -m 'Fix seller product owner ID'
          git push
