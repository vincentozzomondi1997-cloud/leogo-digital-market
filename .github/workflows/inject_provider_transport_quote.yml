name: Inject Provider Transport Quote Workflow
on:
  push:
    branches: [main]

jobs:
  inject:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject quote workflow into provider dashboard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('provider_dashboard.html')
          text = p.read_text(encoding='utf-8')
          marker = '<script src="transport_quote_workflow.js"></script>'
          if marker not in text:
              text = text.replace('</body>', marker + '\n</body>')
              p.write_text(text, encoding='utf-8')
          PY
          if git diff --quiet -- provider_dashboard.html; then
            echo 'No provider dashboard change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add provider_dashboard.html
          git commit -m 'Load transport quote workflow in provider dashboard'
          git push
