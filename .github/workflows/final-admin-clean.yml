name: Final Admin Clean
on:
  push:
    paths:
      - 'final-admin-clean.trigger'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary admin integrations
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          text=p.read_text(encoding='utf-8')
          text=text.replace('<script src="admin_login_guard.js"></script>\n','')
          text=text.replace('<script src="admin_premium_acceptance_loader.js"></script>\n','')
          text=text.replace('<script src="admin_premium_management.js"></script>\n','')
          p.write_text(text,encoding='utf-8')
          for f in [
            'admin_login_guard.js',
            'admin_premium_acceptance_loader.js',
            'admin_premium_management.js',
            'admin_premium_profile_media_review.js',
            'admin_premium_profile_application_media_addon.js',
            'cleanup-premium-admin.trigger',
            'restore-admin-clean.trigger',
            'final-admin-clean.trigger',
            '.github/workflows/cleanup-premium-admin.yml',
            '.github/workflows/restore-admin-clean.yml',
            '.github/workflows/final-admin-clean.yml'
          ]:
            q=Path(f)
            if q.exists(): q.unlink()
          PY
      - name: Commit clean Admin
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Restore clean Admin dashboard flow'
          git push
