name: Fix Premium identity submission loop
on:
  push:
    paths:
      - 'fix_premium_identity.trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace identity script safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('premium_identity.js')
          s=p.read_text()
          s=s.replace("  let lastKey='';\n  let busy=false;", "  let lastKey='';\n  let busy=false;\n  let rendering=false;")
          s=s.replace("  async function inject(){\n    const area=findArea();if(!area)return;", "  async function inject(){\n    if(rendering || busy)return;\n    const area=findArea();if(!area)return;\n    rendering=true;")
          s=s.replace("    const m=await membership();if(!m){box.innerHTML='';return;}", "    try{\n    const m=await membership();if(!m){box.innerHTML='';return;}")
          s=s.replace("    box.innerHTML=formHtml();\n    bindForm(m.id);\n  }", "    box.innerHTML=formHtml();\n    bindForm(m.id);\n    } finally { rendering=false; }\n  }")
          s=s.replace("      lastKey='';await inject();\n      renderMessage('<div class=\"notice success\"><b>Identity submitted to LEOGO Admin.</b><br>Your payment and identity are now waiting for administrative review. You will not be activated until both are approved.</div>');", "      lastKey='submitted';\n      const currentBox=document.getElementById('leogoPremiumIdentityBox');\n      if(currentBox)currentBox.innerHTML='<div class=\"notice success\"><b>Identity submitted to LEOGO Admin.</b><br>Your payment and identity are now waiting for administrative review. You will not be activated until both are approved.</div>';" )
          s=s.replace("  const observer=new MutationObserver(()=>{if(document.getElementById('leogoPremiumModal'))inject();});", "  const observer=new MutationObserver(()=>{if(document.getElementById('leogoPremiumModal')&&!busy&&!rendering)inject();});")
          p.write_text(s)
          for x in ['premium_identity_fix.js','integrate_identity_fix.trigger']:
              Path(x).unlink(missing_ok=True)
          Path('fix_premium_identity.trigger').unlink(missing_ok=True)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add premium_identity.js premium_identity_fix.js integrate_identity_fix.trigger fix_premium_identity.trigger .github/workflows/fix-premium-identity-loop.yml
          git add -u
          git commit -m 'Fix Premium identity submission render loop' || true
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-premium-identity-loop.yml || true
          git commit -m 'Remove temporary Premium identity fix workflow' || true
          git push || true
