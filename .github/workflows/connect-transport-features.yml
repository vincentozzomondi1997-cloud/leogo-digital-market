name: Connect transport features
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject transport scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          patches = {
              'seller_register.html': '<script src="transport_registration.js"></script>',
              'index.html': '<script src="transport_marketplace.js"></script>'
          }
          for fn, tag in patches.items():
              p=Path(fn); s=p.read_text(encoding='utf-8')
              if tag not in s:
                  s=s.replace('</body>', tag+'\n</body>', 1)
                  p.write_text(s, encoding='utf-8')
          PY
      - name: Commit connections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seller_register.html index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Connect multi-vehicle transport features"
          git push
