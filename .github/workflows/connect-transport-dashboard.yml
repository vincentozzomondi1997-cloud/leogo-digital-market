name: Connect transporter dashboard
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject transporter dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('provider_dashboard.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="transport_dashboard.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit connection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add provider_dashboard.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Connect transporter dashboard"
          git push
