name: Restore admin product page
on:
  push:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore page before temporary diagnostics
        run: |
          git checkout 47cff2565ec5512d3bd3bf583c46a2b7545a97d9 -- admin_products.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin_products.html
          git diff --cached --quiet || git commit -m 'Restore admin product approval page'
          git push
          git rm .github/workflows/restore-admin-products.yml
          git commit -m 'Remove temporary admin restore workflow'
          git push
