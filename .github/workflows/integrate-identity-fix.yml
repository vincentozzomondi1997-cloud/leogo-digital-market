name: Integrate Premium identity UI fix
on:
  push:
    paths:
      - 'integrate_identity_fix.trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace identity script with stable version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<script src="premium_identity.js"></script>','<script src="premium_identity_fix.js"></script>')
          if 'premium_identity_fix.js' not in s:
              s=s.replace('</body>','<script src="premium_identity_fix.js"></script>\n</body>',1)
          p.write_text(s)
          Path('integrate_identity_fix.trigger').unlink(missing_ok=True)
          PY
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html integrate_identity_fix.trigger
          git diff --cached --quiet || git commit -m 'Fix Premium identity submission UI loop'
          git push
