name: Integrate Premium identity module
on:
  push:
    paths:
      - 'integrate_premium_identity.trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Premium identity script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="premium_identity.js"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit('index.html closing body tag not found')
              s=s.replace(marker, tag+'\n'+marker, 1)
              p.write_text(s)
          Path('integrate_premium_identity.trigger').unlink(missing_ok=True)
          PY
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html integrate_premium_identity.trigger
          git diff --cached --quiet || git commit -m 'Integrate Premium identity module'
          git push
