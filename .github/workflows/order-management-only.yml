name: LEOGO Order Management Only
on:
  push:
    paths:
      - '.github/workflows/order-management-only.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch only order management
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text()
          marker='<!-- LEOGO ORDER MANAGEMENT ONLY -->'
          if marker in s:
              raise SystemExit('Order management patch already present; stopping safely.')
          patch=r'''<script>
          /* LEOGO ORDER MANAGEMENT ONLY: do not alter authentication or other modules. */
          (function(){
            const orderStatuses=['Order Placed','Confirmed','Preparing','Ready for Pickup','Out for Delivery','Delivered','Cancelled'];
            function orderEsc(v){return typeof esc==='function'?esc(v==null?'':String(v)):String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
            function orderMoney(v){return typeof money==='function'?money(v):('KSh '+Number(v||0).toLocaleString());}
            function orderPill(v,cls){return typeof pill==='function'?pill(v,cls):'<span class="pill '+(cls||'')+'">'+orderEsc(v)+'</span>';}
            window.loadOrders=async function(){
              const a=document.getElementById('ordersArea');
              if(!a)return;
              a.innerHTML='<div class="empty">Loading customer orders…</div>';
              const q=await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(300);
              if(q.error){a.innerHTML='<div class="msg error">Could not load customer orders: '+orderEsc(q.error.message)+'</div>';return;}
              orders=q.data||[];
              window.renderOrders();
            };
            window.renderOrders=function(){
              const a=document.getElementById('ordersArea'); if(!a)return;
              const list=(orders||[]).filter(o=>orderFilter==='all'?true:orderFilter==='delivered'?String(o.status||'').toLowerCase()==='delivered':orderFilter==='cancelled'?String(o.status||'').toLowerCase()==='cancelled':!['delivered','cancelled'].includes(String(o.status||'').toLowerCase()));
              if(!list.length){a.innerHTML='<div class="empty">No '+orderEsc(orderFilter)+' customer orders found.</div>';return;}
              a.innerHTML='<div class="notice"><b>Order Management</b><br>Open an order to review the customer, items, delivery details, payment and total before changing its status.</div><div class="table-wrap"><table class="table"><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Delivery</th><th>Total</th><th>Payment</th><th>Status</th><th>Admin Action</th></tr></thead><tbody>'+list.map(o=>{
                const st=String(o.status||'Order Placed');
                return '<tr><td><b>#'+orderEsc(String(o.id).slice(0,8))+'</b><br><span class="muted">'+new Date(o.created_at).toLocaleString()+'</span></td><td><b>'+orderEsc(o.receiver_name||'')+'</b><br>'+orderEsc(o.receiver_phone||'')+'</td><td>Order items are available in VIEW ORDER</td><td>'+orderEsc(o.delivery_location||'')+'<br><span class="muted">'+orderEsc(o.estate||o.subcounty||o.county||'')+'</span></td><td><b>'+orderMoney(o.total_amount)+'</b><br><span class="muted">Sub '+orderMoney(o.subtotal)+' · Fee '+orderMoney(o.service_fee)+' · Delivery '+orderMoney(o.delivery_fee)+'</span></td><td>'+orderEsc(o.payment_method||'')+'<br>'+orderPill(o.payment_status||'pending',(o.payment_status||'').toLowerCase()==='paid'?'green':'')+'</td><td>'+orderPill(st,st.toLowerCase()==='delivered'?'green':st.toLowerCase()==='cancelled'?'red':'')+'</td><td><div class="actions"><button class="orange" onclick="viewOrder('${o.id}')">VIEW CUSTOMER ORDER</button><select onchange="updateOrderStatus('${o.id}',this.value)">'+orderStatuses.map(x=>'<option '+(x===st?'selected':'')+'>'+orderEsc(x)+'</option>').join('')+'</select></div></td></tr>';
              }).join('')+'</tbody></table></div>';
            };
            window.viewOrder=async function(id){
              const o=(orders||[]).find(x=>x.id===id); if(!o)return;
              const items=await sb.from('order_items').select('*').eq('order_id',id);
              const itemRows=(items.data||[]).map(i=>'<div class="setting-row"><div><b>'+orderEsc(i.product_name||'Product')+'</b><div class="muted">Quantity: '+orderEsc(i.quantity)+(i.variation_id?' · Selected variation':'')+'</div></div><b>'+orderMoney(i.line_total)+'</b></div>').join('');
              document.getElementById('modalTitle').textContent='Customer Order #'+String(id).slice(0,8);
              document.getElementById('modalBody').innerHTML='<div class="notice"><b>Admin responsibility</b><br>Verify the order details, confirm/prepare it, keep the customer informed through the normal LEOGO process, and update the order status as it progresses. Only mark <b>Delivered</b> after delivery is completed. Use <b>Cancelled</b> only when the order is genuinely cancelled.</div><div class="detail"><div><b>Customer / Receiver</b>'+orderEsc(o.receiver_name)+'</div><div><b>Phone</b>'+orderEsc(o.receiver_phone)+'</div><div><b>Delivery Location</b>'+orderEsc(o.delivery_location)+'</div><div><b>Estate / Area</b>'+orderEsc(o.estate||o.subcounty||o.county||'')+'</div><div><b>Landmark</b>'+orderEsc(o.landmark)+'</div><div><b>Payment Method</b>'+orderEsc(o.payment_method)+'</div><div><b>Payment Status</b>'+orderEsc(o.payment_status||'pending')+'</div><div><b>Current Status</b>'+orderEsc(o.status||'Order Placed')+'</div><div><b>Subtotal</b>'+orderMoney(o.subtotal)+'</div><div><b>Service Fee</b>'+orderMoney(o.service_fee)+'</div><div><b>Delivery Fee</b>'+orderMoney(o.delivery_fee)+'</div><div><b>Grand Total</b><b>'+orderMoney(o.total_amount)+'</b></div></div><div class="card" style="margin-top:14px"><h3 style="margin-top:0">Customer Order Items</h3>'+(itemRows||'<div class="muted">No order items returned.</div>')+'</div><div class="card" style="margin-top:14px"><h3 style="margin-top:0">Update Order Status</h3><div class="actions">'+orderStatuses.map(x=>'<button class="'+(x===o.status?'orange':'light')+'" onclick="updateOrderStatus(\''+o.id+'\',\''+x+'\');setTimeout(()=>viewOrder(\''+o.id+'\'),400)">'+orderEsc(x)+'</button>').join('')+'</div></div>';
              document.getElementById('modal').classList.remove('hidden');
            };
          })();
          </script>
          <!-- LEOGO ORDER MANAGEMENT ONLY -->'''
          s=s.replace('</body>',patch+'\n</body>',1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'Build order management customer order workflow'
          git rm .github/workflows/order-management-only.yml
          git commit -m 'Remove temporary order management workflow'
          git push
