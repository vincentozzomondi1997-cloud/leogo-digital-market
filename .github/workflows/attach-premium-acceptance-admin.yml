name: Attach Premium Acceptance Admin Panel

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Attach isolated loader to admin.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="admin_premium_acceptance_loader.js"></script>'
          if tag not in text:
              marker = '</head>'
              if marker not in text:
                  raise SystemExit('admin.html does not contain </head>')
              text = text.replace(marker, tag + '\n' + marker, 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time integration workflow
        run: rm -f .github/workflows/attach-premium-acceptance-admin.yml

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html .github/workflows/attach-premium-acceptance-admin.yml
          if git diff --cached --quiet; then
            echo "No integration changes needed."
            exit 0
          fi
          git commit -m "Attach Premium acceptance admin panel"
          git push
