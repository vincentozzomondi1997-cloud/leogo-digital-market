name: Refresh Owner Customer View Fix
on:
  push:
    paths:
      - '.github/workflows/refresh_owner_customer_view_fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update customer view cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('premium_profile_owner_dashboard.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'premium_profile_owner_customer_view_fix\.js\?v=[^"\']+', 'premium_profile_owner_customer_view_fix.js?v=20260914-4', s, count=1)
          if n != 1:
              raise SystemExit('Customer view script tag not found')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "LEOGO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add premium_profile_owner_dashboard.html
          git commit -m "Refresh owner customer profile view cache" || true
          git push
