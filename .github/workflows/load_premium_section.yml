name: Load Premium section
on:
  push:
    paths:
      - '.github/workflows/load_premium_section.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Premium loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="premium_section.js"></script>'
          if tag not in s:
              anchor='</body>'
              if anchor not in s:
                  raise SystemExit('Body closing tag not found')
              s=s.replace(anchor,tag+'\n'+anchor,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit loader
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Load Premium section on customer website'
          git push